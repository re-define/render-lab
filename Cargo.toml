[package]
name = "render-lab"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
anyhow = "1"
raw-window-handle="0.6"
windows-sys={version="0.61.2",features=["Win32_Foundation","Win32_UI_WindowsAndMessaging","Win32_UI_Input_KeyboardAndMouse","Win32_System_LibraryLoader","Win32_Graphics_Gdi"]}
bytemuck = { version = "1", features = ["derive"] }
glam = { version = "0.29", features = ["serde"] }
half = "2.7"
gltf = "1.4"
meshoptimizer-rs = { version = "=0.2.19", features = ["clusterlod"] }
gpui = { version = "=0.2.2", default-features = false }
image = { version = "0.25", default-features = false }
rayon = "1"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
tempfile = "3"
vulkanalia = { version = "0.35", features = ["libloading"] }

[profile.dev]
debug = 0

[profile.dev.package.meshoptimizer-rs]
opt-level = 2
